# RepOS deploy compose file. One service: the API. RepOS has no database of
# its own — it only reads other ventures' Pathfinder databases over the
# network, so there is no `db` service here (contrast a Pathfinder compose
# file, which owns its Postgres). Source credentials come from `.env`
# (REPOS_SOURCE_<SLUG>_DATABASE_URL, see .env.example and docs/DEPLOY.md).
#
# The web bundle is built into the image at apps/web/dist (see Dockerfile).
# The `web-dist` named volume below is mounted over that same path in the
# api container; on first `docker compose up`, Docker copies the image's
# existing apps/web/dist content into the (empty) volume, so the built
# bundle ends up on the host under the volume's data directory without a
# separate build step. Point Caddy's `root` at that path — see
# Caddyfile.example and docs/DEPLOY.md for how to find it.
#
# REPOS_API_HOST is forced to 0.0.0.0 here (in the compose environment only,
# never in .env) so the API binds the container's bridge interface — the
# `.env` default of 127.0.0.1 is for host/dev use and would make the API
# unreachable through the published port. The `127.0.0.1:` prefix on the
# port mapping below is what actually restricts exposure to the host itself.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: repos-api:local
    command: ['npm', 'run', 'start', '-w', 'apps/api']
    env_file:
      - .env
    environment:
      - REPOS_API_HOST=0.0.0.0
    ports:
      - '127.0.0.1:${REPOS_API_PORT:-3200}:${REPOS_API_PORT:-3200}'
    volumes:
      - web-dist:/app/apps/web/dist
    restart: unless-stopped

volumes:
  web-dist:
